syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.chat.grpc";
option java_outer_classname = "ChatProto";

service ChatService {
  rpc SayHello(HelloRequest)
    returns (HelloResponse);

  rpc StreamGreetings(HelloRequest)
    returns (stream HelloResponse);

  rpc CalculateSum(stream Number)
      returns (SumResponse);

  rpc Chat(stream ChatMessage)
    returns (stream ChatMessage);
}

message HelloRequest {
  string name = 1;
}

message HelloResponse {
  string message = 1;
}

message Number {
  int32 value = 1;
}

message SumResponse {
  int32 sum = 1;
}

message ChatMessage{
    string sender = 1;
    string content = 2;
    MessageType type = 3;
    string recipient = 4;
}

enum MessageType{
    JOIN = 0;
    CHAT = 1;
    LEAVE = 2;
    SYSTEM = 3;
    PRIVATE = 4;
}